name: Sync from personal repo

on:
  schedule:
    # Weekly, Monday 00:30 UTC (offset by 30m to avoid race with any other sync)
    - cron: "30 0 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Sync files from li-xisheng/claude-skills
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -rf /tmp/personal-claude-skills
          git clone --depth 1 https://github.com/li-xisheng/claude-skills.git /tmp/personal-claude-skills

          # No --delete: this repo may hold skills that only exist here
          # (personal-only additions), so files absent from the source
          # repo are never removed — only added or updated.
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/workflows/' \
            /tmp/personal-claude-skills/ ./

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to sync"
            exit 0
          fi

          git commit -m "sync: copy files from li-xisheng/claude-skills"
          git push origin master
